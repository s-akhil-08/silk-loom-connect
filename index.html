    <!-- Mobile Theme Colors -->
    <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)" />
    
    <script>
      (function() {
        try {
          var urlParams = new URLSearchParams(window.location.search);
          var urlTheme = urlParams.get('theme');
          if (urlTheme === 'dark' || urlTheme === 'light' || urlTheme === 'system') {
            localStorage.setItem('silk-loom-theme', urlTheme);
            urlParams.delete('theme');
            var newQuery = urlParams.toString();
            var newUrl = window.location.pathname + (newQuery ? '?' + newQuery : '') + window.location.hash;
            if (window.history && window.history.replaceState) {
              window.history.replaceState(null, '', newUrl);
            }
          }
          var saved = localStorage.getItem('silk-loom-theme') || localStorage.getItem('teja-qr-theme');
          var isDark = false;
          if (saved === 'dark') {
            isDark = true;
          } else if (saved === 'system') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else if (saved === 'light') {
            isDark = false;
          } else {
            // Default theme is light
            isDark = false;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
